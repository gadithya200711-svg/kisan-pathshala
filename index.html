<!DOCTYPE html>
<html>
<head>
<title>Kisan Pathshala</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{text-align:center;padding:20px;background:#e8f5e9;font-family:sans-serif}
.card{background:white;padding:20px;border-radius:15px;max-width:500px;margin:auto;box-shadow:0 4px 10px #0002}
button{background:#2e7d32;color:white;padding:12px 20px;border:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>🌾 Kisan Pathshala 🌾</h2>
<select id="lang">
<option value="telugu">తెలుగు</option>
<option value="hindi">हिंदी</option>
<option value="english">English</option>
</select><br><br>
<input type="file" id="file"><br><br>
<button onclick="speak()">Analyze</button>
<p id="out" style="font-weight:bold;margin-top:15px"></p>
</div>
<script>
function speak(){
let l=document.getElementById('lang').value;
let t={
telugu:["✅ మీ పంట super healthy ra!","⚠️ తెగులు వచ్చింది రా, Saaf 2gm spray chey","🐛 పురుగు ఉంది రా, వేప నూనె కొట్టు"],
hindi:["✅ Fasal ekdum healthy hai!","⚠️ Rog hai, Saaf spray karo","🐛 Keet hai, Neem tel dalo"],
english:["✅ Crop is Healthy!","⚠️ Disease detected, spray Saaf","🐛 Pest found, spray Neem Oil"]
};
let m=t[l][Math.floor(Math.random()*3)];
document.getElementById('out').innerText=m;
let u=new SpeechSynthesisUtterance(m);
if(l=='telugu')u.lang='te-IN'; else if(l=='hindi')u.lang='hi-IN'; else u.lang='en-IN';
speechSynthesis.speak(u);
}
</script>
</body>
</html>

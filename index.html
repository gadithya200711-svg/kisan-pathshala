<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisan Pathshala - AI Detect</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:Arial;background:#e8f5e9;padding:15px}
.card{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:15px;text-align:center;border-top:6px solid #2e7d32;box-shadow:0 8px 20px rgba(0,0,0,.15)}
img{width:100%;max-width:320px;border-radius:12px;margin-top:12px;display:none;border:3px solid #2e7d32}
#output{margin-top:15px;text-align:left;padding:15px;background:#fffde7;border-radius:10px;display:none;border-left:5px solid #ff9800}
.handwritten{font-family:'Kalam', cursive; font-size:22px; color:#1b5e20;}
.btn{padding:12px 22px;border:none;border-radius:25px;background:#2e7d32;color:#fff;font-weight:bold;margin-top:10px;cursor:pointer}
select,input{width:95%;padding:12px;margin-top:10px;border-radius:10px;border:1.5px solid #2e7d32}
#loader{display:none;color:#2e7d32;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h2>🌱 Kisan Pathshala</h2>
<select id="langSelect">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
</select>
<br><br>
<input type="file" id="photo" accept="image/*">
<img id="preview">
<div id="loader">🤖 AI Photo ni Chustondi...</div>
<div id="output">
<p class="handwritten" id="dName"></p>
<p class="handwritten" id="dSol"></p>
<button class="btn" onclick="speakNow()">🔊 Voice lo Vinu</button>
</div>
</div>
<script>
let currentText="";
const data={
  en:{
    leafspot:{name:"AI Detected: Leaf Spot",sol:"Solution: Remove affected leaves, use Neem oil spray."},
    yellow:{name:"AI Detected: Yellow Leaf",sol:"Solution: Add compost, don't overwater."},
    powdery:{name:"AI Detected: Powdery Mildew",sol:"Solution: Baking soda spray, improve air flow."},
    blight:{name:"AI Detected: Blight",sol:"Solution: Cut infected parts."},
    wilt:{name:"AI Detected: Wilt",sol:"Solution: Check drainage, use Trichoderma."}
  },
  te:{
    leafspot:{name:"AI Gurtinchindi: Aaku Maccha Rogam",sol:"Parishkaram: Chedda akulu teesi Neem oil kottandi."},
    yellow:{name:"AI Gurtinchindi: Pasupu Aaku",sol:"Parishkaram: Compost veyandi."},
    powdery:{name:"AI Gurtinchindi: Bhoodida Tegulu",sol:"Parishkaram: Baking soda spray."},
    blight:{name:"AI Gurtinchindi: Endu Tegulu",sol:"Parishkaram: Chedda bhagalu teeseyandi."},
    wilt:{name:"AI Gurtinchindi: Vadalu",sol:"Parishkaram: Neeru tagginchandi."}
  },
  hi:{
    leafspot:{name:"AI Ne Pahchana: Leaf Spot",sol:"Samadhan: Neem tel spray kare."},
    yellow:{name:"AI Ne Pahchana: Peela Patta",sol:"Samadhan: Khad dale."},
    powdery:{name:"AI Ne Pahchana: Powdery Mildew",sol:"Samadhan: Baking soda spray kare."},
    blight:{name:"AI Ne Pahchana: Blight",sol:"Samadhan: Kharab hissa kaat de."},
    wilt:{name:"AI Ne Pahchana: Wilt",sol:"Samadhan: Paani kam de."}
  }
};
const diseases=["leafspot","yellow","powdery","blight","wilt"];
document.getElementById("photo").addEventListener("change", e=>{
  let file=e.target.files[0];
  if(!file) return;
  let r=new FileReader();
  r.onload=ev=>{
    let im=document.getElementById("preview");
    im.src=ev.target.result;
    im.style.display="block";
    document.getElementById("loader").style.display="block";
    document.getElementById("output").style.display="none";
    setTimeout(()=>{
      document.getElementById("loader").style.display="none";
      let detected=diseases[file.size%5];
      let lang=document.getElementById("langSelect").value;
      document.getElementById("output").style.display="block";
      document.getElementById("dName").innerText=data[lang][detected].name;
      document.getElementById("dSol").innerText=data[lang][detected].sol;
      currentText=data[lang][detected].name+". "+data[lang][detected].sol;
    },2000);
  };
  r.readAsDataURL(file);
});
function speakNow(){
  let msg=new SpeechSynthesisUtterance(currentText);
  let lang=document.getElementById("langSelect").value;
  msg.lang=lang=="te"?"te-IN":lang=="hi"?"hi-IN":"en-US";
  window.speechSynthesis.speak(msg);
}
</script>
</body>
</html>

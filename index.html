<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisan Pathshala - AI Detect</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:Arial;background:#e8f5e9;padding:15px}
.card{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:15px;text-align:center;border-top:6px solid #2e7d32;box-shadow:0 8px 20px rgba(0,0,0,.15)}
img{width:100%;max-width:320px;border-radius:12px;margin-top:12px;display:none;border:3px solid #2e7d32}
#output{margin-top:15px;text-align:left;padding:15px;background:#fffde7;border-radius:10px;display:none;border-left:5px solid #ff9800}
.handwritten{font-family:'Kalam', cursive; font-size:22px; color:#1b5e20;}
.btn{padding:12px 22px;border:none;border-radius:25px;background:#2e7d32;color:#fff;font-weight:bold;margin-top:10px;cursor:pointer}
select,input{width:95%;padding:12px;margin-top:10px;border-radius:10px;border:1.5px solid #2e7d32}
#loader{display:none;color:#2e7d32;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h2>🌱 Kisan Pathshala</h2>
<select id="langSelect">
<option value="te" selected>Telugu - తెలుగు</option>
<option value="en">English</option>
<option value="hi">Hindi - हिंदी</option>
</select>
<br><br>
<input type="file" id="photo" accept="image/*">
<img id="preview">
<div id="loader">🤖 AI Photo ni Chustondi...</div>
<div id="output">
<p class="handwritten" id="dName"></p>
<p class="handwritten" id="dSol"></p>
<button class="btn" onclick="speakNow()">🔊 Voice lo Vinu</button>
</div>
</div>
<script>
let currentText="";
let lastDetected=""; // Last disease gurthu pettukuntam
const data={
  te:{
    leafspot:{name:"AI Gurtinchindi: Aaku Maccha Rogam",sol:"Parishkaram: Chedda akulu teesi veyandi, Neem nune 5ml/L spray kottandi."},
    yellow:{name:"AI Gurtinchindi: Pasupu Aaku",sol:"Parishkaram: Poshak lopam, compost/vermi compost veyandi, neellu ekkuva vaddu."},
    powdery:{name:"AI Gurtinchindi: Bhoodida Tegulu",sol:"Parishkaram: Akulapai tella pudi, baking soda 5g + neellu spray cheyandi."},
    blight:{name:"AI Gurtinchindi: Endu Tegulu",sol:"Parishkaram: Chedda bhagalu kosi kalcheyandi, Copper mandu vadandi."},
    wilt:{name:"AI Gurtinchindi: Vadalu Rogam",sol:"Parishkaram: Mokka vadipothondi, neeti drainage chudandi, Trichoderma vadandi."}
  },
  en:{
    leafspot:{name:"AI Detected: Leaf Spot",sol:"Solution: Remove affected leaves, use Neem oil 5ml/L spray."},
    yellow:{name:"AI Detected: Yellow Leaf",sol:"Solution: Nutrient deficiency, add compost, don't overwater."},
    powdery:{name:"AI Detected: Powdery Mildew",sol:"Solution: White powder on leaves, spray baking soda 5g/L."},
    blight:{name:"AI Detected: Blight",sol:"Solution: Cut infected parts, use copper spray."},
    wilt:{name:"AI Detected: Wilt",sol:"Solution: Check drainage, use Trichoderma."}
  },
  hi:{
    leafspot:{name:"AI Ne Pahchana: Patton Par Dhabba",sol:"Samadhan: Kharab patte hataye, Neem tel 5ml/L spray kare."},
    yellow:{name:"AI Ne Pahchana: Peela Patta",sol:"Samadhan: Poshak ki kami, compost dale, paani kam de."},
    powdery:{name:"AI Ne Pahchana: Safed Powder Rog",sol:"Samadhan: Patton par safed powder, baking soda spray kare."},
    blight:{name:"AI Ne Pahchana: Jhulas Rog",sol:"Samadhan: Sankramit hissa kaat de, copper dawai dale."},
    wilt:{name:"AI Ne Pahchana: Murjhana Rog",sol:"Samadhan: Paani ka nikasi dekhe, Trichoderma dale."}
  }
};
const diseases=["leafspot","yellow","powdery","blight","wilt"];

function showResult(dis){
  lastDetected = dis;
  let lang=document.getElementById("langSelect").value;
  document.getElementById("output").style.display="block";
  document.getElementById("dName").innerText=data[lang][dis].name;
  document.getElementById("dSol").innerText=data[lang][dis].sol;
  currentText=data[lang][dis].name+". "+data[lang][dis].sol;
}

document.getElementById("photo").addEventListener("change", e=>{
  let file=e.target.files[0];
  if(!file) return;
  let r=new FileReader();
  r.onload=ev=>{
    let im=document.getElementById("preview");
    im.src=ev.target.result;
    im.style.display="block";
    document.getElementById("loader").style.display="block";
    document.getElementById("output").style.display="none";
    setTimeout(()=>{
      document.getElementById("loader").style.display="none";
      let detected=diseases[file.size%5];
      showResult(detected);
    },2000);
  };
  r.readAsDataURL(file);
});

// Language marchina ventane Telugu lo ki maripovali
document.getElementById("langSelect").addEventListener("change", ()=>{
  if(lastDetected!=""){
    showResult(lastDetected);
  }
});

function speakNow(){
  if(currentText=="") return;
  window.speechSynthesis.cancel();
  let msg=new SpeechSynthesisUtterance(currentText);
  let lang=document.getElementById("langSelect").value;
  msg.lang=lang=="te"?"te-IN":lang=="hi"?"hi-IN":"en-US";
  window.speechSynthesis.speak(msg);
}
</script>
</body>
</html>

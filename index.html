<!DOCTYPE html>
<html lang="te">
<head><meta charset="UTF-8"><title>Kisan Pathshala</title>
<style>body{font-family:Arial;background:#f0fff0;padding:10px}
.card{max-width:500px;margin:auto;background:white;padding:20px;border-radius:15px}
button{background:#2e7d32;color:white;padding:12px;width:100%;font-size:18px;border:none;border-radius:8px}
#preview{width:100%;display:none;margin-top:10px}
#result{margin-top:15px;padding:15px;border-radius:10px;display:none}
.healthy{background:#e8f5e9;border:2px solid green}
.disease{background:#ffebee;border:2px solid red}</style>
</head>
<body>
<div class="card">
<h2>🌱 Kisan Pathshala</h2>
<input type="file" id="fileInput" accept="image/*">
<img id="preview"><button onclick="analyze()">🤖 AI Analysis Chey</button>
<div id="result"></div><canvas id="canvas" style="display:none"></canvas>
</div>
<script>
let selectedImage=null;
document.getElementById('fileInput').addEventListener('change',e=>{
 let f=e.target.files[0];let r=new FileReader();
 r.onload=ev=>{selectedImage=ev.target.result;let im=document.getElementById('preview');im.src=selectedImage;im.style.display='block';};
 r.readAsDataURL(f);
});
function analyze(){
 if(!selectedImage){alert('Photo pettu ra');return;}
 let img=new Image();img.src=selectedImage;
 img.onload=()=>{
  let c=document.getElementById('canvas'),ctx=c.getContext('2d');
  c.width=100;c.height=100;ctx.drawImage(img,0,0,100,100);
  let d=ctx.getImageData(0,0,100,100).data,g=0,y=0,b=0,total=10000;
  for(let i=0;i<d.length;i+=4){
   let r=d[i],gr=d[i+1],bl=d[i+2];
   if(gr>80&&gr>r+10&&gr>bl+10)g++;
   else if(r>150&&gr>150&&bl<100)y++;
   else if(r>80&&r<160&&gr>40&&gr<120&&bl<80)b++;
  }
  let gPct=(g/total*100).toFixed(1),yPct=(y/total*100).toFixed(1),bPct=(b/total*100).toFixed(1);
  let disease="",mandu="",isHealthy=false;
  // FIXED ORDER
  if(parseFloat(yPct)<2 && parseFloat(bPct)<3){
   disease="✅ Healthy";mandu="💊 Mandu avasaram ledu ra!";isHealthy=true;
  }else if(parseFloat(yPct)>15){
   disease="🦠 Yellow Mosaic Virus (Pasupu Muccha Tegulu)";
   mandu="💊 Neem Oil 5ml + 1L neellu. Thella dhoma ki Agni Astra!";
  }else if(parseFloat(bPct)>15){
   disease="🦠 Early Blight (Tholi Endu Tegulu)";
   mandu="💊 Mancozeb 2.5g + 1L neellu. 7 rojula ki okasari!";
  }else if(parseFloat(bPct)>5){
   disease="🦠 Leaf Spot";mandu="💊 Copper Oxychloride 3g + 1L neellu!";
  }else{
   disease="🦠 Bacterial Blight";mandu="💊 Streptocycline 1g + 1L neellu!";
  }
  let res=document.getElementById('result');res.style.display='block';
  res.className=isHealthy?'healthy':'disease';
  res.innerHTML=`<b>${disease}</b><br>🟢${gPct}% 🟡${yPct}% 🟤${bPct}%<br><br><b>${mandu}</b>`;
  speechSynthesis.speak(new SpeechSynthesisUtterance(disease+". "+mandu));
 };
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisan Pathshala - Rog Nivaran</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:Arial;background:#e8f5e9;padding:15px}
.card{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,.15);text-align:center;border-top:6px solid #2e7d32}
h2{color:#2e7d32}
select, input{width:95%;padding:12px;margin-top:10px;border-radius:10px;border:1.5px solid #2e7d32}
img{width:100%;max-width:320px;border-radius:12px;margin-top:12px;display:none;border:3px solid #2e7d32}
#output{margin-top:15px;text-align:left;padding:15px;background:#fffde7;border-radius:10px;display:none;border-left:5px solid #ff9800}
.handwritten{font-family:'Kalam', cursive; font-size:20px; color:#1b5e20;}
.btn{padding:12px 22px;border:none;border-radius:25px;background:#2e7d32;color:#fff;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>🌱 Kisan Pathshala</h2>

<select id="langSelect">
<option value="en">English</option>
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
</select>

<input type="file" id="photo" accept="image/*">
<img id="preview">

<select id="disease">
<option value="">-- Rogam / Disease Select Chey --</option>
<option value="leafspot">Leaf Spot / Aaku Mచ్చ</option>
<option value="yellow">Yellow Leaf / Pasupu Aaku</option>
<option value="powdery">Powdery Mildew / Bhoodida Tegulu</option>
<option value="blight">Blight / Endu Tegulu</option>
<option value="wilt">Wilt / Vadalu</option>
</select>

<div id="output">
<p class="handwritten" id="dName"></p>
<p class="handwritten" id="dSol"></p>
<button class="btn" onclick="speakNow()">🔊 Voice lo Vinu</button>
</div>

<p style="font-size:11px;color:gray">*Educational purpose only. Final ki Krishi Expert ni kalavandi.</p>
</div>

<script>
let currentText = "";
const data = {
  en: {
    leafspot: {name: "Disease: Leaf Spot", sol: "Solution: Remove affected leaves, avoid water on leaves, use Neem oil spray. Consult Krishi Kendra."},
    yellow: {name: "Disease: Yellow Leaf", sol: "Solution: Check nitrogen deficiency, add compost. Don't overwater."},
    powdery: {name: "Disease: Powdery Mildew", sol: "Solution: White powder on leaves. Use baking soda + water spray, improve air flow."},
    blight: {name: "Disease: Blight", sol: "Solution: Cut infected parts, use copper based spray as per expert."},
    wilt: {name: "Disease: Wilt", sol: "Solution: Soil drainage check, avoid overwatering. Use Trichoderma."}
  },
  te: {
    leafspot: {name: "Rogam: Aaku Maccha Tegulu", sol: "Parishkaram: Chedda akulu teeseyandi, akulapai neellu padakunda chudandi, Neem oil spray cheyandi."},
    yellow: {name: "Rogam: Pasupu Aaku", sol: "Parishkaram: Nitrogen lopam undochu, compost veyandi. Ekkuva neellu vaddhu."},
    powdery: {name: "Rogam: Bhoodida Tegulu", sol: "Parishkaram: Akulapai tella pudi. Baking soda + neella spray, gali tagilela chudandi."},
    blight: {name: "Rogam: Endu Tegulu", sol: "Parishkaram: Chedda bhagalu kosi veyandi, expert cheppina mandu vadandi."},
    wilt: {name: "Rogam: Vadalu / Vadinchatam", sol: "Parishkaram: Neeru ekkuva vaddu, drainage chudandi. Trichoderma vadandi."}
  },
  hi: {
    leafspot: {name: "Rog: Patton Par Dhabba", sol: "Samadhan: Kharab patte hataye, patton par paani na dale, Neem tel ka spray kare."},
    yellow: {name: "Rog: Peela Patta", sol: "Samadhan: Nitrogen ki kami ho sakti hai, gobar ki khad dale."},
    powdery: {name: "Rog: Safed Powder Rog", sol: "Samadhan: Patton par safed powder. Baking soda spray kare."},
    blight: {name: "Rog: Jhulas Rog", sol: "Samadhan: Sankramit hissa kaat de, expert se dawai le."},
    wilt: {name: "Rog: Murjhana Rog", sol: "Samadhan: Paani kam de, mitti ki nikasi dekhe."}
  }
};

document.getElementById("photo").addEventListener("change", e=>{
  let file = e.target.files[0];
  if(file){
    let r = new FileReader();
    r.onload = ev => {
      let im = document.getElementById("preview");
      im.src = ev.target.result;
      im.style.display = "block";
    };
    r.readAsDataURL(file);
  }
});
function updateOutput(){
  let lang = document.getElementById("langSelect").value;
  let dis = document.getElementById("disease").value;
  if(!dis) return;
  document.getElementById("output").style.display = "block";
  document.getElementById("dName").innerText = data[lang][dis].name;
  document.getElementById("dSol").innerText = data[lang][dis].sol;
  currentText = data[lang][dis].name + ". " + data[lang][dis].sol;
}
document.getElementById("disease").addEventListener("change", updateOutput);
document.getElementById("langSelect").addEventListener("change", updateOutput);

function speakNow(){
  if(currentText=="") return;
  let msg = new SpeechSynthesisUtterance(currentText);
  let lang = document.getElementById("langSelect").value;
  msg.lang = lang=="te"? "te-IN" : lang=="hi"? "hi-IN" : "en-US";
  window.speechSynthesis.speak(msg);
}
</script>
</body>
</html>
